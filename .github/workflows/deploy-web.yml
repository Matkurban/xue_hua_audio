name: Deploy web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Analyze example
        working-directory: packages/xue_hua_audio/example
        run: flutter analyze
      - name: Build web
        working-directory: packages/xue_hua_audio/example
        run: flutter build web --release --base-href /xue_hua_audio/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/xue_hua_audio/example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
