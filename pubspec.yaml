name: xue_hua_audio
description: "Cross-platform native Flutter audio plugin — playback (file/URL/asset) and microphone recording with real-time amplitude, on Android/iOS/macOS/Windows/Linux/Web."
version: 2.2.0
repository: https://github.com/Matkurban/xue_hua_audio
issue_tracker: https://github.com/Matkurban/xue_hua_audio/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  meta: ^1.18.3
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.11
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.xuehua.xue_hua_audio_android
        pluginClass: XueHuaAudioAndroidPlugin
      ios:
        pluginClass: XueHuaAudioDarwinPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: XueHuaAudioDarwinPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: XueHuaAudioWindowsPluginCApi
      linux:
        pluginClass: XueHuaAudioLinuxPlugin
      web:
        pluginClass: XueHuaAudioWebPlugin
        fileName: xue_hua_audio_web.dart
