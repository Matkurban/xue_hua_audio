name: xue_hua_audio_windows
description: "Windows implementation of the xue_hua_audio plugin, using Media Foundation and WASAPI. / xue_hua_audio 插件的 Windows 实现，基于 Media Foundation 与 WASAPI。"
version: 2.0.1
repository: https://github.com/Matkurban/xue_hua_audio
issue_tracker: https://github.com/Matkurban/xue_hua_audio/issues
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  xue_hua_audio_platform_interface: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: xue_hua_audio
    platforms:
      windows:
        pluginClass: XueHuaAudioWindowsPluginCApi
