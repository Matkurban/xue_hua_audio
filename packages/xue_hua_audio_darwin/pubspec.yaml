name: xue_hua_audio_darwin
description: "iOS and macOS implementation of the xue_hua_audio plugin, using AVFoundation (AVPlayer + AVAudioEngine). / xue_hua_audio 插件的 iOS 与 macOS 实现，基于 AVFoundation（AVPlayer + AVAudioEngine）。"
version: 2.0.2
repository: https://github.com/Matkurban/xue_hua_audio
issue_tracker: https://github.com/Matkurban/xue_hua_audio/issues
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  xue_hua_audio_platform_interface: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: xue_hua_audio
    platforms:
      ios:
        pluginClass: XueHuaAudioDarwinPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: XueHuaAudioDarwinPlugin
        sharedDarwinSource: true
