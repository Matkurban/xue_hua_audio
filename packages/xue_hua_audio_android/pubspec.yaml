name: xue_hua_audio_android
description: "Android implementation of the xue_hua_audio plugin, using Media3 ExoPlayer and AudioRecord. / xue_hua_audio 插件的 Android 实现，基于 Media3 ExoPlayer 与 AudioRecord。"
version: 2.0.2
repository: https://github.com/Matkurban/xue_hua_audio
issue_tracker: https://github.com/Matkurban/xue_hua_audio/issues
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  xue_hua_audio_platform_interface: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: xue_hua_audio
    platforms:
      android:
        package: com.xuehua.xue_hua_audio_android
        pluginClass: XueHuaAudioAndroidPlugin
