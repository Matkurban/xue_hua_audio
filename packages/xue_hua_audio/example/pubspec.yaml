name: xue_hua_audio_example
description: "Demonstrates how to use the xue_hua_audio plugin"
publish_to: "none"
version: 2.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  path_provider: ^2.1.6
  xue_hua_audio:
    path: ../
  flex_color_scheme: ^9.0.0
  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
