name: xue_hua_audio
description: "Cross-platform native Flutter audio plugin — playback (file/URL/asset) and microphone recording with real-time amplitude, on Android/iOS/macOS/Windows/Linux/Web. / 跨平台原生 Flutter 音频插件——支持本地文件/网络/Asset 播放与麦克风录音（实时振幅），覆盖六大平台。"
version: 2.0.0
repository: https://github.com/Matkurban/xue_hua_audio
issue_tracker: https://github.com/Matkurban/xue_hua_audio/issues
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  xue_hua_audio_platform_interface: ^2.0.0
  xue_hua_audio_android: ^2.0.0
  xue_hua_audio_darwin: ^2.0.0
  xue_hua_audio_web: ^2.0.0
  xue_hua_audio_windows: ^2.0.0
  xue_hua_audio_linux: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        default_package: xue_hua_audio_android
      ios:
        default_package: xue_hua_audio_darwin
      macos:
        default_package: xue_hua_audio_darwin
      web:
        default_package: xue_hua_audio_web
      windows:
        default_package: xue_hua_audio_windows
      linux:
        default_package: xue_hua_audio_linux
